<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início - Sinais que Guiam</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <header class="cabecalho-home">
    <div>
      <p class="saudacao">Olá, <span id="nome-usuario">Maria</span>!</p>
      <h1>Biblioteca SENAI</h1>
    </div>
    <a href="perfil.html" class="avatar-topo" aria-label="Ir para o perfil">
      <span id="inicial-avatar">M</span>
    </a>
  </header>

  <main class="conteudo-home">
    <form class="barra-busca" role="search" id="form-busca-home">
      <label for="busca-home" class="rotulo-oculto">Pesquisar livros, autores</label>
      <input type="search" id="busca-home" placeholder="Pesquisar livros, autores...">
      <button type="button" class="botao-microfone" aria-label="Buscar por voz">
        <i class="ph ph-microphone" aria-hidden="true"></i>
      </button>
    </form>

    <h2 class="titulo-secao">Acesso rápido</h2>
    <nav class="grade-atalhos" aria-label="Acesso rápido">
      <a href="busca.html" class="atalho">
        <i class="ph ph-book-open" aria-hidden="true"></i>
        <span>Buscar livro</span>
      </a>
      <a href="qrcode.html" class="atalho">
        <i class="ph ph-qr-code" aria-hidden="true"></i>
        <span>Escanear QR</span>
      </a>
      <a href="historico.html" class="atalho">
        <i class="ph ph-clock-counter-clockwise" aria-hidden="true"></i>
        <span>Histórico</span>
      </a>
      <a href="favoritos.html" class="atalho">
        <i class="ph ph-star" aria-hidden="true"></i>
        <span>Favoritos</span>
      </a>
      <a href="ajuda.html" class="atalho">
        <i class="ph ph-question" aria-hidden="true"></i>
        <span>Ajuda</span>
      </a>
    </nav>

    <div class="cabecalho-secao">
      <h2 class="titulo-secao">Livros recentes</h2>
      <a href="busca.html" class="link-ver-todos">Ver todos</a>
    </div>
    <div id="lista-livros-recentes" class="lista-livros-recentes">
      <!-- Preenchido dinamicamente via JavaScript (Etapa 22) -->
      <p class="texto-carregando">Carregando livros recentes...</p>
    </div>
  </main>

  <nav class="menu-inferior" aria-label="Navegação principal">
    <a href="home.html" class="item-menu ativo">
      <i class="ph-fill ph-house" aria-hidden="true"></i><span>Início</span>
    </a>
    <a href="configuracoes.html" class="item-menu">
      <i class="ph ph-gear" aria-hidden="true"></i><span>Ajustes</span>
    </a>
    <a href="qrcode.html" class="item-menu item-menu-destaque">
      <i class="ph-fill ph-qr-code" aria-hidden="true"></i>
    </a>
    <a href="favoritos.html" class="item-menu">
      <i class="ph ph-bookmark-simple" aria-hidden="true"></i><span>Salvos</span>
    </a>
    <a href="perfil.html" class="item-menu">
      <i class="ph ph-user" aria-hidden="true"></i><span>Perfil</span>
    </a>
  </nav>

  <script src="js/script.js"></script>
</body>
</html>
