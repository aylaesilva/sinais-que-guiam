<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escanear QR Code - Sinais que Guiam</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <header class="cabecalho-secundario cabecalho-escuro">
    <button type="button" class="botao-voltar" onclick="window.location.href='home.html'" aria-label="Voltar para o início">
      <i class="ph ph-arrow-left" aria-hidden="true"></i>
    </button>
    <h1>Escanear QR</h1>
  </header>

  <main class="tela-qrcode">
    <p class="instrucao-qrcode">Aponte a câmera para o QR Code na estante</p>

    <div id="area-scanner" class="area-scanner" aria-hidden="true">
      <i class="ph ph-qr-code icone-scanner"></i>
    </div>

    <p id="status-qrcode" class="status-qrcode" role="status" aria-live="polite"></p>

    <button type="button" id="botao-ler-qrcode" class="botao-primario">
      Ler QR Code
    </button>
  </main>

  <nav class="menu-inferior" aria-label="Navegação principal">
    <a href="home.html" class="item-menu">
      <i class="ph ph-house" aria-hidden="true"></i><span>Início</span>
    </a>
    <a href="configuracoes.html" class="item-menu">
      <i class="ph ph-gear" aria-hidden="true"></i><span>Ajustes</span>
    </a>
    <a href="qrcode.html" class="item-menu item-menu-destaque">
      <i class="ph-fill ph-qr-code" aria-hidden="true"></i>
    </a>
    <a href="favoritos.html" class="item-menu">
      <i class="ph ph-bookmark-simple" aria-hidden="true"></i><span>Salvos</span>
    </a>
    <a href="perfil.html" class="item-menu">
      <i class="ph ph-user" aria-hidden="true"></i><span>Perfil</span>
    </a>
  </nav>

  <script src="js/script.js"></script>
  <script src="acessibilidade.js"></script>
</body>
</html>
