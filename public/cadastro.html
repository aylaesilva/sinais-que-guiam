<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - Sinais que Guiam</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <header class="cabecalho-secundario">
    <button type="button" class="botao-voltar" onclick="window.location.href='login.html'" aria-label="Voltar para o login">
      ←
    </button>
    <h1>Criar Conta</h1>
  </header>

  <main class="tela-auth">
    <form id="form-cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" required autocomplete="name"
               placeholder="Digite seu nome completo">
      </div>

      <div class="campo">
        <label for="email-cadastro">E-mail Corporativo</label>
        <input type="email" id="email-cadastro" name="email" required autocomplete="email"
               placeholder="Digite seu e-mail">
      </div>

      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" required autocomplete="tel"
               placeholder="Digite seu telefone">
      </div>

      <div class="campo">
        <label for="senha-cadastro">Senha</label>
        <div class="campo-senha">
          <input type="password" id="senha-cadastro" name="senha" required
                 autocomplete="new-password" minlength="8">
            <button type="button" class="botao-mostrar-senha" data-alvo="senha-cadastro" aria-label="Mostrar senha">
            <i class="ph ph-eye" aria-hidden="true"></i>
            </button>
            </button>
        </div>
      </div>

      <div class="campo">
        <label for="confirmar-senha">Confirmar senha</label>
        <div class="campo-senha">
          <input type="password" id="confirmar-senha" name="confirmar_senha" required
                 autocomplete="new-password" minlength="8">
            <button type="button" class="botao-mostrar-senha" data-alvo="confirmar-senha" aria-label="Mostrar senha">
            <i class="ph ph-eye" aria-hidden="true"></i>
            </button>
        </div>
      </div>

      <div class="campo">
        <label for="tipo-deficiencia">Tipo de Deficiência</label>
        <select id="tipo-deficiencia" name="tipo_deficiencia" required>
          <option value="" disabled selected>Selecione uma opção</option>
          <option value="baixa_visao">Baixa visão</option>
          <option value="cegueira">Cegueira</option>
          <option value="daltonismo">Daltonismo</option>
          <option value="nenhuma">Nenhuma</option>
        </select>
      </div>

      <div class="campo campo-checkbox">
        <input type="checkbox" id="aceite-termos" name="aceite_termos" required>
        <label for="aceite-termos">
          Li e aceito os <a href="#">Termos de uso e a Política de Privacidade</a>
        </label>
      </div>

      <p id="erro-cadastro" class="mensagem-erro" role="alert" aria-live="assertive"></p>

      <button type="submit" class="botao-primario">Criar conta</button>
    </form>
  </main>

  <script src="js/script.js"></script>
  <script src="acessibilidade.js"></script>
</body>
</html>
